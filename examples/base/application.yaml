apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperclip
  namespace: paperclip
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperclip-files
  namespace: paperclip
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  namespace: paperclip
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperclip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperclip
    spec:
      serviceAccountName: paperclip
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperclip
          image: ghcr.io/gen-skeptic/paperclip-codex-mcp-compat@sha256:30577d8e9c171294338aca4adb3862011d2a5dd699d7224f8c3d2da54df47573
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3100
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 1Gi
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3100"
            - name: HOME
              value: /paperclip
            - name: PAPERCLIP_HOME
              value: /paperclip
            - name: PAPERCLIP_API_URL
              value: http://127.0.0.1:3100
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: authenticated
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: private
            - name: PAPERCLIP_PUBLIC_URL
              value: http://localhost:3100
            - name: PAPERCLIP_AUTH_BASE_URL_MODE
              value: explicit
            - name: PAPERCLIP_AUTH_PUBLIC_BASE_URL
              value: http://localhost:3100
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: localhost,127.0.0.1
            - name: PAPERCLIP_AUTH_DISABLE_SIGN_UP
              value: "true"
            - name: PAPERCLIP_AUTH_RATE_LIMIT_ENABLED
              value: "true"
            - name: HEARTBEAT_SCHEDULER_ENABLED
              value: "false"
            - name: PAPERCLIP_TELEMETRY_DISABLED
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: PAPERCLIP_DB_BACKUP_ENABLED
              value: "false"
            - name: PAPERCLIP_MIGRATION_AUTO_APPLY
              value: "true"
            - name: PAPERCLIP_SECRETS_PROVIDER
              value: local_encrypted
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paperclip-runtime
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperclip-runtime
                  key: BETTER_AUTH_SECRET
            - name: PAPERCLIP_SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: paperclip-runtime
                  key: PAPERCLIP_SECRETS_MASTER_KEY
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: files
              mountPath: /paperclip
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: paperclip-files
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip
  namespace: paperclip
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paperclip
  ports:
    - name: http
      port: 3100
      targetPort: http
