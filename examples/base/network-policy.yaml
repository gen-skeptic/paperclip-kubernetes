apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperclip
  namespace: paperclip
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperclip
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: paperclip-db
      ports:
        - protocol: TCP
          port: 5432
